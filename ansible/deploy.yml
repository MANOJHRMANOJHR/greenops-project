---
- name: Deploy GreenOps Project on AWS Ubuntu VM
  hosts: oracle
  become: yes
  gather_facts: no

  tasks:
    - name: Install required system packages
      apt:
        name:
          - docker.io
          - git
          - curl
          - unzip
          - rsync
        state: present
        update_cache: yes

    - name: Install Docker Compose standalone binary
      shell: |
        mkdir -p /usr/local/lib/docker/cli-plugins
        curl -SL https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
        chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
      args:
        creates: /usr/local/lib/docker/cli-plugins/docker-compose

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Create project directory
      file:
        path: /opt/greenops-project
        state: directory
        mode: '0755'

    - name: Sync project files to AWS VM
      synchronize:
        src: "{{ playbook_dir }}/../"
        dest: /opt/greenops-project/
        delete: yes
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=actions-runner"
          - "--exclude=__pycache__"
          - "--exclude=.pytest_cache"
          - "--exclude=*.log"
          - "--exclude=runtime-watchdog.log"
          - "--exclude=nginx/active.conf"

    - name: Ensure active nginx config exists only first time
      shell: |
        cd /opt/greenops-project
        if [ ! -f nginx/active.conf ]; then
          cp nginx/blue.conf nginx/active.conf
        fi
      args:
        creates: /opt/greenops-project/nginx/active.conf

    - name: Bootstrap containers if Nginx is not running
      shell: |
        cd /opt/greenops-project
        if ! docker ps --format '{{ "{{.Names}}" }}' | grep -q '^nginx$'; then
          docker compose up -d --build
        fi

    - name: Run blue-green deployment script
      shell: |
        cd /opt/greenops-project
        bash scripts/deploy-bluegreen.sh

    - name: Start runtime watchdog
      shell: |
        cd /opt/greenops-project

        if [ -f runtime-watchdog.pid ]; then
          OLD_PID=$(cat runtime-watchdog.pid)

          if kill -0 "$OLD_PID" 2>/dev/null; then
            echo "Stopping old runtime watchdog with PID $OLD_PID"
            kill "$OLD_PID" || true
            sleep 2
          fi

          rm -f runtime-watchdog.pid
        fi

        echo "Starting new runtime watchdog..."
        nohup bash scripts/runtime-watchdog.sh >> runtime-watchdog.log 2>&1 &

        echo $! > runtime-watchdog.pid

        echo "Runtime watchdog started with PID $(cat runtime-watchdog.pid)"
      args:
        executable: /bin/bash

    - name: Run resource optimization cleanup
      shell: |
        cd /opt/greenops-project
        bash scripts/cleanup.sh

    - name: Collect recent logs
      shell: |
        cd /opt/greenops-project
        bash scripts/logs.sh > latest_logs.txt